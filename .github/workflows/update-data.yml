name: Update strategy data

# Runs every day at 23:00 UTC (midnight Lisbon winter, 1am summer).
# After all major markets closed so data reflects the full trading day.
#
# NOTE: currently runs EVERY day for testing. After confirming it works,
# change the cron to '0 23 * * 1-5' (Mon-Fri only).
on:
  schedule:
    - cron: '0 23 * * *'  # every day 23:00 UTC
  workflow_dispatch:      # allow manual runs from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit wizard-data.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Download TradingView data
        working-directory: scripts
        run: python download_tv.py

      - name: Run VC2 processing
        working-directory: scripts
        run: python vc2_trending_value.py

      - name: Copy wizard-data.json to repo root
        run: cp scripts/wizard-data.json wizard-data.json

      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add wizard-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit — data already up to date."
          else
            git commit -m "Auto-update strategy data $(date -u +%Y-%m-%d)"
            git push
          fi
